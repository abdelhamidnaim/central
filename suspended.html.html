<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر مغلق مؤقتاً</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Cairo',Arial,sans-serif;
    background:#0f172a;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .lock{font-size:72px;margin-bottom:20px;}
  h1{color:#fff;font-size:28px;font-weight:900;margin-bottom:12px;}
  p{color:#94a3b8;font-size:16px;max-width:380px;line-height:1.8;}
  .wa-btn{
    margin-top:24px;display:inline-flex;align-items:center;gap:10px;
    background:#25D366;color:#fff;text-decoration:none;
    padding:14px 28px;border-radius:50px;font-weight:800;font-size:16px;
    box-shadow:0 8px 24px rgba(37,211,102,0.35);
    transition:transform .2s;
  }
  .wa-btn:active{transform:scale(0.97);}
  .divider{margin-top:36px;width:48px;height:4px;background:#1a56db;border-radius:2px;opacity:0.4;}
</style>
</head>
<body>

  <div class="lock">🔒</div>
  <h1>المتجر مغلق مؤقتاً</h1>
  <p>نعمل على تحسين تجربتك، سنعود قريباً.</p>
  <a id="waBtn" class="wa-btn" href="https://wa.me/212687155245" target="_blank">
    <i class="fab fa-whatsapp" style="font-size:20px;"></i> تواصل معنا عبر واتساب
  </a>
  <div class="divider"></div>

<script>
  // هذه الصفحة نفسها تعيش في المستودع المركزي، لذا نستخدم رابط نسبي لـ stores.json
  // (يعملان من نفس مجلد GitHub Pages)
  var CONFIG_URL = "./stores.json";
  var DEFAULT_WHATSAPP = "212687155245";
  var CHECK_INTERVAL_MS = 8000; // يفحص كل 8 ثوانٍ إن عادت الحالة إلى active

  var params  = new URLSearchParams(location.search);
  var backUrl = params.get('back') || '/'; // رابط الرجوع لموقع العميل الأصلي (يُمرَّر من license.js)
  var wa      = params.get('wa') || DEFAULT_WHATSAPP;

  document.getElementById('waBtn').href = "https://wa.me/" + wa;

  // نحتاج معرفة دومين موقع العميل (وليس دومين هذه الصفحة) لفحص حالته في stores.json
  var clientHost = '';
  try { clientHost = new URL(backUrl).hostname.replace(/^www\./, ''); } catch (e) {}

  function checkIfReactivated() {
    if (!clientHost) return;
    fetch(CONFIG_URL + "?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var store = data[clientHost];
        if (!store || store.status !== 'suspended') {
          location.replace(backUrl);
        }
      })
      .catch(function () {});
  }

  setInterval(checkIfReactivated, CHECK_INTERVAL_MS);
</script>
</body>
</html>
